name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gate:
    name: Rust Backend Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Check code formatting
        run: cd backend && cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cd backend && cargo clippy --workspace -- -D warnings

      - name: Run unit and contract tests
        run: cd backend && cargo test --workspace

  frontend-quality-gate:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Strict TypeScript typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Build Vite production bundle
        run: cd frontend && npm run build
